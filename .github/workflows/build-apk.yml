name: Gerar APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar projeto
        run: bash .github/scripts/preparar_projeto.sh

      - name: Gerar APK
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cronometro-rcp-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar APK em versão do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Cronômetro RCP - versão 1
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
