name: Gerar APK do Cronômetro RCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar projeto Android
        run: |
          chmod +x .github/scripts/preparar_projeto.sh
          .github/scripts/preparar_projeto.sh

      - name: Compilar APK de teste
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cronometro-rcp-apk
          path: app/build/outputs/apk/debug/*.apk
